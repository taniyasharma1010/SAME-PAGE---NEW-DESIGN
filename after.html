<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Brew Café</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #2d3748; background-color: #f7fafc; padding: 1.5rem; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    header { border-bottom: 2px solid #edf2f7; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h1 { color: #1a202c; font-size: 1.8rem; margin-bottom: 0.5rem; }
    h2 { color: #2b6cb0; font-size: 1.3rem; margin-bottom: 0.75rem; border-left: 4px solid #3182ce; padding-left: 0.5rem; }
    section { margin-bottom: 1.5rem; }
    ul { list-style-type: none; }
    li { background: #edf2f7; margin-bottom: 0.5rem; padding: 0.75rem 1rem; border-radius: 6px; font-weight: 500; display: flex; justify-content: space-between; }
    footer { text-align: center; color: #a0aec0; font-size: 0.875rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #edf2f7; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Urban Brew Café</h1>
      <p>Freshly brewed coffee and handmade pastries daily.</p>
    </header>

    <section>
      <h2>Our Menu</h2>
      <ul>
        <li><span>Espresso</span> <span>$3.50</span></li>
        <li><span>Cold Brew</span> <span>$4.50</span></li>
        <li><span>Avocado Toast</span> <span>$7.00</span></li>
      </ul>
    </section>

    <section>
      <h2>Visit Us</h2>
      <p>123 Main Street, Open daily from 7:00 AM to 6:00 PM.</p>
    </section>

    <footer>
      <p>© 2026 Urban Brew Café. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
